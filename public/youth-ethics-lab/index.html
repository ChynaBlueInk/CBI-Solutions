<!doctype html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Youth Ethics Lab: a self-paced course for teens on making choices that matter, built around five interactive scenario videos.">
<title>Youth Ethics Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --bg:#F6F4EF; --surface:#FFFFFF; --ink:#1B2130; --muted:#5A6172; --line:#DEDAD0; --soft:#EFECE4;
  --accent:#B06D12; --accent-ink:#FFFFFF; --accent-soft:#F7EBD6;
  --m1:#4A5BA8; --m2:#B06D12; --m3:#2E7D6B; --m4:#B0425F; --m5:#6A4FB0; --m6:#2F6F9A;
  --good:#2C7A4B; --good-soft:#E1F1E6; --warn:#946010; --warn-soft:#F7ECD8; --bad:#A63A3A; --bad-soft:#F6E1E1;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121520; --surface:#1B1F2C; --ink:#ECEAE4; --muted:#A3A8B6; --line:#2E3344;
    --soft:#232838; --accent:#E8B04B; --accent-ink:#1B1F2C; --accent-soft:#3A2F1A;
    --m1:#9AA8EC; --m2:#E8B04B; --m3:#6CC7B0; --m4:#EC8FA8; --m5:#B7A2F0; --m6:#86C0E6;
    --good:#6CC28F; --good-soft:#15291E; --warn:#E0AE5E; --warn-soft:#2D2415; --bad:#E58A8A; --bad-soft:#321B1B;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121520; --surface:#1B1F2C; --ink:#ECEAE4; --muted:#A3A8B6; --line:#2E3344;
  --soft:#232838; --accent:#E8B04B; --accent-ink:#1B1F2C; --accent-soft:#3A2F1A;
  --m1:#9AA8EC; --m2:#E8B04B; --m3:#6CC7B0; --m4:#EC8FA8; --m5:#B7A2F0; --m6:#86C0E6;
  --good:#6CC28F; --good-soft:#15291E; --warn:#E0AE5E; --warn-soft:#2D2415; --bad:#E58A8A; --bad-soft:#321B1B;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.6;padding:0 16px 56px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,5.5vw,3.1rem);font-weight:800;letter-spacing:-.02em}
h2{font-size:clamp(1.5rem,3.6vw,2.1rem);font-weight:800;letter-spacing:-.015em}
h3{font-size:1.18rem;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.wrap{max-width:880px;margin:0 auto}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);margin:0 -16px;padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.topin{max-width:880px;margin:0 auto;display:flex;align-items:center;gap:8px}
.brand{font-family:var(--display);font-weight:800;font-size:1.05rem;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:6px 12px;font-size:.85rem;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:700}
.helpbtn{border:2px solid var(--bad);background:var(--surface);color:var(--bad);border-radius:999px;padding:5px 14px;font-weight:700;font-size:.88rem;min-height:36px}
.bar{max-width:880px;margin:8px auto 0;height:6px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.tabs{max-width:880px;margin:8px auto 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.84rem;white-space:nowrap;min-height:34px;display:inline-flex;align-items:center;gap:6px}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--c,var(--muted))}
.tab[aria-current="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);font-weight:700}
.tab.done::after{content:"\2713";color:var(--good);font-weight:800}

/* layout blocks */
main{padding-top:28px}
.hero{padding:10px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--c,var(--accent));margin-bottom:6px}
.hero p.lead{font-size:1.12rem;margin-top:12px;max-width:62ch}
section.blk{margin:0 0 30px}
section.blk>h2{margin-bottom:12px}
section.blk>p+p{margin-top:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px 18px 20px;margin:14px 0}
.card>h3{margin-bottom:8px}
.card p+p{margin-top:8px}
.card.tint{background:var(--accent-soft);border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.pill{display:inline-block;font-size:.76rem;font-weight:700;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--muted)}
ul.clean{margin:8px 0 0;padding-left:20px}
ul.clean li{margin:4px 0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;min-height:44px;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.opts{display:grid;gap:8px;margin-top:10px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;min-height:44px;line-height:1.4}
.opt:hover{border-color:var(--c,var(--accent))}
.opt.sel{border-color:var(--c,var(--accent));box-shadow:inset 0 0 0 1px var(--c,var(--accent));background:var(--soft)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.ok{border-color:var(--warn);background:var(--warn-soft)}
.fb{margin-top:10px;padding:10px 14px;border-radius:10px;font-size:.95rem;border-left:4px solid var(--muted);background:var(--soft)}
.fb.good{border-color:var(--good);background:var(--good-soft)}
.fb.bad{border-color:var(--bad);background:var(--bad-soft)}
.fb.warn{border-color:var(--warn);background:var(--warn-soft)}
textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;resize:vertical;line-height:1.5}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;min-height:44px}
label.lbl{display:block;font-weight:700;margin:12px 0 6px}
.private{font-size:.82rem;color:var(--muted);margin-top:6px}
.private::before{content:"\1F512  "}

/* episode */
.player{position:relative;border-radius:16px;overflow:hidden;background:#14161c;border:1px solid var(--line)}
.player iframe{display:block;width:100%;height:720px;border:0;background:#14161c}
.epmeta{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px}
.epmeta .pill{background:var(--c);color:var(--bg)}
.cnote{border:2px solid var(--warn);background:var(--warn-soft);border-radius:16px;padding:18px}
.cnote h3{margin-bottom:6px}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-decoration:underline;font-weight:700}
.chips{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px;margin-top:10px}
.chip{border:1px dashed var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;text-align:left;min-height:52px;line-height:1.3;font-size:.92rem}
.chip b{display:block;font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chip.got{border-style:solid;border-color:var(--c);background:var(--soft)}
.chip.got b{color:var(--c)}
.count{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--c)}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
tr.lock td{color:var(--muted);font-style:italic}
tr.got td:first-child{box-shadow:inset 3px 0 0 var(--c)}
.tscroll{overflow-x:auto}

/* values */
.vals{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.val{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;min-height:40px}
.val[aria-pressed="true"]{background:var(--c,var(--accent));color:var(--bg);border-color:transparent;font-weight:700}

/* four questions */
.fq{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:12px}
.fq .q{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.fq .n{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--accent);line-height:1}
.fq h3{font-size:1.02rem;margin:6px 0 4px}

/* chat */
.chat{display:grid;gap:8px;margin-top:12px;max-width:520px}
.msg{justify-self:start;max-width:90%;text-align:left;border:1px solid var(--line);background:var(--soft);border-radius:16px 16px 16px 4px;padding:9px 13px;line-height:1.4}
.msg[aria-pressed="true"]{border-color:var(--m5);box-shadow:inset 0 0 0 1px var(--m5)}
.msg.flag{background:var(--bad-soft);border-color:var(--bad)}
.msg.fine{background:var(--good-soft);border-color:var(--good)}
.msg small{display:block;margin-top:4px;font-size:.82rem;color:var(--ink)}

/* dialog */
dialog{border:0;border-radius:18px;padding:0;max-width:640px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,20,.55)}
.dlg{padding:22px}
.dlg h2{font-size:1.5rem;margin-bottom:6px}
.sup td:first-child{font-weight:700;width:36%}
.sup a{word-break:break-word}
.navbot{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:20px;border-top:1px solid var(--line);flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:50}
@media (max-width:560px){
  body{font-size:16px}
  .player iframe{height:600px}
  .brand{font-size:.95rem}
}
@media (max-width:560px){table.stack thead{display:none}table.stack tr{display:block;border-bottom:1px solid var(--line);padding:8px 0}table.stack td{display:block;border:0;padding:2px 6px}table.stack td:first-child{font-weight:700}tr.got td:first-child{box-shadow:none}tr.got{box-shadow:inset 3px 0 0 var(--c)}.helpbtn{padding:5px 10px}}
@media print{.top,.navbot,.helpbtn{display:none}}
</style>
</head>
<body>
<header class="top">
  <div class="topin">
    <div class="brand">Youth Ethics <span>Lab</span></div>
    <div class="seg" role="group" aria-label="Where do you live?">
      <button data-act="country" data-v="nz">NZ</button>
      <button data-act="country" data-v="au">AU</button>
    </div>
    <button class="helpbtn" data-act="help">Get help</button>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <nav class="tabs" id="tabs" aria-label="Modules"></nav>
</header>
<main class="wrap" id="main"></main>

<dialog id="helpdlg" aria-labelledby="helptitle">
  <div class="dlg">
    <h2 id="helptitle">Get help</h2>
    <p class="muted">Free and confidential. You won't get in trouble for asking for help.</p>
    <div id="helpbody"></div>
    <div class="row" style="margin-top:16px"><button class="btn" data-act="closehelp">Close</button></div>
  </div>
</dialog>

<script>
(function(){
'use strict';
const e=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* On cbils.dev the episodes load from the same site; anywhere else (e.g. CBILS Learning) they load from www.cbils.dev. */
const ON_SITE=/(^|\.)cbils\.dev$/.test(location.hostname)&&!/^learn\./.test(location.hostname);
const SITE=ON_SITE?'/Scenario/':'https://www.cbils.dev/Scenario/';
const ORIGINS=['https://www.cbils.dev','https://cbils.dev',location.origin];
const NODES=['A1','A2a','A2b','B1','B2a','B2b'];

/* ---------- episodes ---------- */
const EP={
 wallet:{slug:'wallet',story:'the-wallet',n:'01',title:'The Wallet',who:'Maya',line:'Maya finds a stranger’s wallet stuffed with cash. Keep it, or try to return it?',
  summary:'Maya finds a wallet full of cash. If she keeps it, she can spend it, or later decide to give it back, either by dropping it off anonymously or returning it in person. If she tries to return it straight away, she can post it back anonymously or deliver it in person, where the owner offers her a reward she can accept or decline.',
  ends:[
   ['The Weight of a Lie','Keep → Spend','A secret you have to keep keeps costing you.'],
   ['Drop & Run','Keep → Give back → Anonymous drop-off','Fixing it quietly still counts.'],
   ['Face to Face','Keep → Give back → In person','Owning a mistake in person turns guilt into growth.'],
   ['Quiet Integrity','Return → Post it back anonymously','Doing the right thing doesn’t need an audience.'],
   ['Take the Cash','Return → In person → Accept reward','Taking the reward is fine. The real choice was already made.'],
   ['Beyond the Reward','Return → In person → Decline reward','Integrity can open doors money can’t.']]},
 group:{slug:'group_chat',story:'the-group-chat',n:'02',title:'The Group Chat',who:'Ava and Priya',line:'A fake AI-generated image of a classmate lands in the group chat. Pile on, stay silent, or speak up?',sensitive:true,
  note:'This episode is about a fake, AI-generated sexual image of a student being shared in a group chat. Nothing explicit is shown.',
  summary:'A fake, AI-generated sexual image of a classmate, Priya, is posted in the class group chat. Ava can forward it as a joke, adding a mean caption or sending it on silently. Or she can speak up in the chat and say it needs to be deleted because it’s illegal. If she speaks up, she can leave it there or message Priya privately, and then either handle it quietly or report it together with a trusted adult.',
  ends:[
   ['The Ripple You Can’t Take Back','Forward → Mean caption','Forwarding it is evidence, with your name on it.'],
   ['Silence Isn’t Innocence','Forward → Silently → Say nothing','No caption doesn’t make it not a crime.'],
   ['Owning It: Late, But Real','Forward → Silently → Delete and apologise','A real apology matters. The right time to delete was before sending.'],
   ['A Voice in the Chat','Speak up → Public message only','Speaking up took courage, but this needed to go further.'],
   ['Support in the Shadows','Speak up → Message Priya → Handle it privately','Comfort helps, but an illegal image needs reporting.'],
   ['Turning the Tide','Speak up → Message Priya → Report it together','Reporting is what makes it stop.']]},
 party:{slug:'party',story:'speak-up',n:'03',title:'Speak Up',who:'Marcus, Dominic and Sofia',line:'Marcus watches a friend cross a line with a girl at a party. Say nothing, or step in?',sensitive:true,
  note:'This episode shows a young man pressuring a girl at a party and ignoring her discomfort. It touches on consent.',
  summary:'At a party, Marcus sees his friend Dominic cross a line with Sofia. He can say nothing, then either move on or text Sofia later, where he can offer sympathy or apologise and actually talk to Dominic. Or he can step in: pull Dominic aside privately, or call him out in front of the group, where the group either mocks Marcus or a friend backs him up.',
  ends:[
   ['Nothing Changes','Say nothing → Move on','Silence told Dominic this was fine.'],
   ['Too Little, Too Late','Say nothing → Check in → Sympathy','Sofia needed someone in the moment, not after.'],
   ['A Late Start','Say nothing → Check in → Apologise and act','Going back and saying something to Dominic still counted.'],
   ['Man to Man','Step in → Private word','A quiet word worked. Dominic apologised later.'],
   ['The Uncomfortable Silence','Step in → Public → Group mocks him','Unpopular, and still right.'],
   ['The Turning Point','Step in → Public → A friend backs him up','One voice became two, and the standard shifted.']]},
 glasses:{slug:'glasses',story:'the-glasses',n:'04',title:'The Glasses',who:'Eli and Ryan',line:'Ryan is secretly filming people with his camera glasses. Say nothing, or say something?',
  summary:'Eli realises his friend Ryan is secretly filming people at the food court with camera glasses. Eli can say nothing and move on, or bring it up later, either just saying it’s weird or pushing Ryan to delete the clips and stop. Or he can say something at the time: a private word, or saying it in front of the group, where the group either sides with Ryan or a friend backs Eli up.',
  ends:[
   ['Nothing Changes','Say nothing → Move on','Laughing along told Ryan it was funny enough to keep doing, and to share.'],
   ['Too Little, Too Late','Say nothing → Later → “It’s weird”','Ryan heard “weird”, not “don’t”.'],
   ['A Late Start','Say nothing → Later → Delete and stop','Asking him to undo it is what made it real.'],
   ['Man to Man','Say something → Private word','A quiet word worked. Ryan deleted the clips.'],
   ['The Uncomfortable Silence','Say something → Public → Group sides with Ryan','Eli said it once, and meant it.'],
   ['The Turning Point','Say something → Public → A friend backs Eli up','The tech was never the problem. What he did with it was.']]},
 stranger:{slug:'online-stranger',story:'the-online-stranger',n:'05',title:'The Online Stranger',who:'Leah',line:'Someone she’s only ever talked to online wants to meet up. Go alone, or bring someone into it?',sensitive:true,
  note:'This episode is about meeting someone you only know online, and the risk of being manipulated or put in danger.',
  summary:'Leah has been talking to someone online who wants to meet. She can agree to meet alone, telling no one, or telling a friend, who either just gets the location or comes along. Or she can tell a trusted adult first. After that, she can sneak out anyway, or listen and not go, and then either just block the account or report it with screenshots.',
  ends:[
   ['A Close Call','Meet alone → Tell no one','“This time” isn’t a safety plan.'],
   ['A Half-Measure','Meet alone → Tell a friend → Location only','Location pins don’t step in.'],
   ['Strength in Numbers','Meet alone → Tell a friend → Bring her','Bringing someone changed how safe it was.'],
   ['Broken Trust','Tell an adult → Sneak out anyway','Ignoring a clear warning breaks trust that takes time to rebuild.'],
   ['Blocked, Not Solved','Tell an adult → Don’t go → Block','Blocking protects you, not the next person.'],
   ['Stopping It for Someone Else','Tell an adult → Don’t go → Report with screenshots','Reporting prevents the next close call.']]}
};
const STORY2EP={};Object.entries(EP).forEach(([k,v])=>STORY2EP[v.story]=k);

/* ---------- support services ---------- */
const SUP={
 nz:[
  ['Emergency','If you or someone else is in danger right now','Call 111'],
  ['Youthline','Anything, for young people','0800 376 633, free text 234, or <a href="https://www.youthline.co.nz" target="_blank" rel="noopener">youthline.co.nz</a>'],
  ['What’s Up','Free counselling for 5 to 19 year olds','0800 942 8787'],
  ['1737, Need to talk?','Talk or text with a counsellor, any time','Call or text 1737'],
  ['Netsafe','Online bullying, image abuse, sextortion, harmful content','0508 638 723, text 4282, or <a href="https://netsafe.org.nz" target="_blank" rel="noopener">netsafe.org.nz</a>'],
  ['Safe to Talk','Sexual harm, any time','0800 044 334 or text 4334'],
  ['Police (non-emergency)','Reporting something that has already happened','Call 105'],
  ['Youth Law','Free legal help for under 25s','0800 884 529']],
 au:[
  ['Emergency','If you or someone else is in danger right now','Call 000'],
  ['Kids Helpline','Anything, for 5 to 25 year olds, any time','1800 55 1800 or <a href="https://kidshelpline.com.au" target="_blank" rel="noopener">kidshelpline.com.au</a>'],
  ['eSafety Commissioner','Report cyberbullying, image-based abuse and illegal content','<a href="https://www.esafety.gov.au/report" target="_blank" rel="noopener">esafety.gov.au/report</a>'],
  ['ACCCE','Report online child sexual exploitation, grooming and sextortion','<a href="https://www.accce.gov.au/report" target="_blank" rel="noopener">accce.gov.au/report</a>'],
  ['1800RESPECT','Sexual assault, family and domestic violence','1800 737 732'],
  ['Lifeline','Crisis support, any time','13 11 14'],
  ['Police Assistance Line','Reporting something that has already happened','Call 131 444']]
};
const CN={nz:'New Zealand',au:'Australia'};

/* ---------- modules ---------- */
const MODS=[
 {id:'start',lbl:'Start here',c:'--m1'},
 {id:'honesty',lbl:'Honesty',c:'--m2'},
 {id:'friend',lbl:'When a friend crosses a line',c:'--m3'},
 {id:'images',lbl:'Fake images, real harm',c:'--m4'},
 {id:'online',lbl:'Trust and safety online',c:'--m5'},
 {id:'together',lbl:'Bringing it together',c:'--m6'}
];

/* ---------- state ---------- */
const KEY='youth-ethics-lab-v1', PKEY='youth-ethics-lab-private-v1';
const blank=()=>({mod:0,done:{},country:'nz',found:{},hook:{},act:{},quiz:{},values:[],values2:[],gate:{},summ:{},showall:{},reveal:{}});
const pblank=()=>({j:{},plan:{},guess:''});
let S=blank(), P=pblank();
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(blank(),JSON.parse(r));}catch(x){}
try{const r=localStorage.getItem(PKEY);if(r)P=Object.assign(pblank(),JSON.parse(r));}catch(x){}
let saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(x){}lmsSync();},250);chrome();}
function savePriv(){try{localStorage.setItem(PKEY,JSON.stringify(P));}catch(x){}}

/* ---------- LMS sync (CBILS Learning). Journal and plan stay on this device only. ---------- */
let lmsDone=false;
function foundCount(k){return Object.keys(S.found[k]||{}).length;}
function totalFound(){return Object.keys(EP).reduce((a,k)=>a+foundCount(k),0);}
function isComplete(){return MODS.every(m=>S.done[m.id]);}
function lmsSync(){if(!window.LMS)return;
 const pct=Math.round(MODS.filter(m=>S.done[m.id]).length/MODS.length*100);
 const res={'Endings found':totalFound()+'/30'};
 Object.entries(QUIZ).forEach(([k,qs])=>{const a=S.quiz[k]||{};const n=Object.keys(a).length;if(n===qs.length){res['Quick check: '+MODS.find(m=>m.id===k).lbl]=qs.filter((q,i)=>a[i]===q.a).length+'/'+qs.length;}});
 LMS.setState(S);LMS.setResults(res);LMS.setProgress(isComplete()?100:pct);
 if(isComplete()&&!lmsDone){lmsDone=true;LMS.complete();}}

/* ---------- block system (so embedded videos never reload) ---------- */
let BL={};
function B(id,fn){BL[id]=fn;return `<div data-block="${id}">${fn()}</div>`;}
function refresh(id){const el=document.querySelector(`[data-block="${id}"]`);if(el&&BL[id])el.innerHTML=BL[id]();}
function refreshWhere(pred){Object.keys(BL).filter(pred).forEach(refresh);}

function hook(id,q,opts){return B('hook-'+id,()=>{const v=S.hook[id];
 return `<div class="card"><div class="kicker">Before you watch</div><h3>${q}</h3><div class="opts">${opts.map((o,i)=>`<button class="opt ${v===i?'sel':''}" aria-pressed="${v===i}" data-act="hook" data-id="${id}" data-i="${i}">${o}</button>`).join('')}</div>${v!=null?`<p class="fb">No wrong answer here. Keep your pick in mind while you watch, and see if you still feel the same at the end.</p>`:''}</div>`;});}

function episode(k){const ep=EP[k];
 return `<div class="epmeta"><span class="pill">EP. ${ep.n}</span><h3>${ep.title}</h3><span class="muted small">${e(ep.who)}</span></div><p style="margin-bottom:12px">${ep.line}</p>`+
 B('ep-'+k,()=>{
  if(ep.sensitive&&!S.gate[k])return `<div class="cnote"><h3>Content note</h3><p>${ep.note}</p><p style="margin-top:8px">It’s OK to skip this one or come back later. If it brings anything up for you, talk to someone you trust or use the <button class="linkbtn" data-act="help">Get help</button> list.</p><div class="row" style="margin-top:14px"><button class="btn" data-act="gate" data-k="${k}">I’m ready to watch</button><button class="btn ghost" data-act="summ" data-k="${k}">${S.summ[k]?'Hide the summary':'Read a summary instead'}</button></div>${S.summ[k]?`<div class="card" style="margin-bottom:0"><h3>What happens in ${ep.title}</h3><p>${e(ep.summary)}</p><p class="muted small" style="margin-top:8px">You can still explore the endings below and tick them off as you read the endings map.</p></div>`:''}</div>`;

 })+B('end-'+k,()=>endings(k));}

function endings(k){const ep=EP[k],f=S.found[k]||{},n=foundCount(k);
 return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Endings you’ve found</h3><span class="count">${n}/6</span></div><p class="muted small">Try different choices to find all six. Endings tick off by themselves when you reach them in the video, or tap one to tick it off yourself.</p><div class="chips">${ep.ends.map((x,i)=>{const got=!!f[NODES[i]];return `<button class="chip ${got?'got':''}" aria-pressed="${got}" data-act="mark" data-k="${k}" data-n="${NODES[i]}"><b>Ending ${i+1}${got?' ✓':''}</b>${got?e(x[0]):'Not found yet'}</button>`;}).join('')}</div>${n===6?`<p class="fb good">All six found. Nice work exploring.</p>`:''}</div>`;}

function endMap(k,extra){return B('map-'+k,()=>{const ep=EP[k],f=S.found[k]||{},all=S.showall[k];
 return `<div class="card"><div class="row" style="justify-content:space-between"><h3>Endings map: ${ep.title}</h3><button class="btn ghost" data-act="showall" data-k="${k}">${all?'Show only mine':'Show all six'}</button></div><div class="tscroll"><table class="stack"><thead><tr><th>#</th><th>Choices</th><th>Ending</th><th>The point</th></tr></thead><tbody>${ep.ends.map((x,i)=>{const got=!!f[NODES[i]];const show=got||all;return `<tr class="${got?'got':''} ${show?'':'lock'}"><td>Ending ${i+1}</td><td>${show?e(x[1]):'?'}</td><td>${show?'<b>'+e(x[0])+'</b>':'Not found yet'}</td><td>${show?e(x[2]):''}</td></tr>`;}).join('')}</tbody></table></div>${extra||''}</div>`;});}

function modStart(){return `
<div class="hero" style="--c:var(--m1)"><div class="kicker">Module 1</div><h1>Choices that matter</h1><p class="lead">Five interactive stories. You make the calls and see where they lead. Along the way you’ll pick up practical ways to handle tricky situations, online and off.</p></div>
<section class="blk"><h2>How this works</h2>
<div class="grid2">
 <div class="card"><h3>Watch and choose</h3><p>Each episode stops at decision points. You pick what happens next. Every story has six endings.</p></div>
 <div class="card"><h3>Go back and try again</h3><p>There’s no score for the choices you make in the videos. Explore different paths and collect the endings.</p></div>
 <div class="card"><h3>Take something with you</h3><p>Each module gives you one practical skill, a private reflection, and a quick check.</p></div>
</div>
<p class="muted" style="margin-top:6px">Six modules, about 20 to 30 minutes each. Your progress saves as you go.</p></section>
<section class="blk"><h2>A few ground rules</h2>
<div class="card"><ul class="clean">
<li><b>It’s OK to disagree.</b> Some of these situations don’t have one right answer.</li>
<li><b>It’s OK to step away.</b> Some episodes cover heavy topics. You’ll get a heads-up first, and you can read a summary instead.</li>
<li><b>Your reflections are private.</b> They stay on this device. Nobody else sees them.</li>
<li><b>Help is always one tap away.</b> Use the <button class="linkbtn" data-act="help">Get help</button> button at the top any time.</li></ul>
<p style="margin-top:10px">Where do you live? This sets the help services and law info you’ll see.</p>
${B('cty-pick',()=>`<div class="row" style="margin-top:8px"><button class="btn ${S.country==='nz'?'':'ghost'}" data-act="country" data-v="nz">New Zealand</button><button class="btn ${S.country==='au'?'':'ghost'}" data-act="country" data-v="au">Australia</button></div>`)}
</div></section>
<section class="blk"><h2>What is an ethical choice?</h2>
<p>An ethical choice is any time what you do affects someone else and there’s a better or worse way to handle it. Most of them are small and happen fast: a message you forward, a joke you laugh at, money that isn’t yours.</p>
<p>Two lines come up a lot. <b>“No one will know.”</b> That’s about getting caught, not about whether it’s OK. <b>“Everyone does it.”</b> That’s about fitting in, not about who gets hurt.</p>
${valueSort('values','What matters most to you?')}
</section>
<section class="blk"><h2>The four questions</h2>
<p>When something feels off, you won’t have time for a long think. These four questions are quick enough to use in the moment. You’ll use them in every module.</p>
<div class="fq">
 <div class="q"><div class="n">1</div><h3>What’s really going on here?</h3><p class="small muted">Notice the situation, and how you feel about it.</p></div>
 <div class="q"><div class="n">2</div><h3>Who could be affected?</h3><p class="small muted">Including people who aren’t in the room.</p></div>
 <div class="q"><div class="n">3</div><h3>What are my options?</h3><p class="small muted">There’s usually more than “do nothing” or “make a scene”.</p></div>
 <div class="q"><div class="n">4</div><h3>Who can help?</h3><p class="small muted">A friend, a trusted adult, a service, a report button.</p></div>
</div>
${B('warm',()=>{const r=S.reveal.warm;return `<div class="card tint" style="margin-top:16px"><div class="kicker">Try it</div><h3>Your friend is at sports practice. They message: “Can you log in as me and do my online maths quiz? Everyone does it.”</h3><p class="muted small">Think through the four questions, then compare.</p><div class="row" style="margin-top:10px"><button class="btn ghost" data-act="reveal" data-id="warm">${r?'Hide':'Show'} one way to think it through</button></div>${r?`<ol class="clean" style="margin-top:10px"><li><b>What’s going on?</b> They want you to do their work and hand it in as theirs. “Everyone does it” is pressure, not a reason.</li><li><b>Who’s affected?</b> Your friend (they don’t learn it, and could get in trouble), you (you could too), and the teacher who’s trusting the results.</li><li><b>Options?</b> Say no. Say no and offer to go through it together later. Suggest they ask the teacher for more time.</li><li><b>Who can help?</b> The teacher, if they’re stuck on the work itself.</li></ol>`:''}</div>`;})}
</section>
${reflect('m1','Think of a time you had to choose between two things that both mattered to you. What did you choose?')}
${finish(0)}`;}

<p>Speak Up and The Glasses branch in exactly the same way. That makes it easy to compare what each choice leads to.</p>
${B('compare',()=>{const fa=S.found.party||{},fb=S.found.glasses||{};return `<div class="card tscroll"><table class="stack"><thead><tr><th>Ending</th><th>Speak Up</th><th>The Glasses</th></tr></thead><tbody>${EP.party.ends.map((x,i)=>`<tr><td><b>${i+1}. ${e(x[0])}</b><br><span class="muted small">${e(x[1].replace('Check in','Later'))}</span></td><td>${fa[NODES[i]]||S.showall.cmp?e(x[2]):'<span class="muted">Not found yet</span>'}</td><td>${fb[NODES[i]]||S.showall.cmp?e(EP.glasses.ends[i][2]):'<span class="muted">Not found yet</span>'}</td></tr>`).join('')}</tbody></table><div class="row" style="margin-top:10px"><button class="btn ghost" data-act="showall" data-k="cmp">${S.showall.cmp?'Show only mine':'Show all'}</button></div></div>`;})}
<div class="grid2">
 <div class="card"><h3>Why do people stay quiet?</h3><p>Fear of being next. Not wanting drama. Loyalty. Assuming someone else will act. All real. But in both episodes, silence was read as “this is fine”.</p></div>
 <div class="card"><h3>Private or public?</h3><p>A private word worked in both stories. So did speaking up in front of the group. Pick the one that’s safe for you and most likely to make it stop.</p></div>
 <div class="card"><h3>What later can and can’t fix</h3><p>Checking in afterwards is kind, but it doesn’t help the person in the moment. Going back and actually asking your friend to stop, or to delete it, is what turns late into real.</p></div>
 <div class="card"><h3>It’s the behaviour, not the tech</h3><p>Camera glasses aren’t the problem. Filming people without them knowing is. It’s a breach of their privacy even if you never share it. Sharing makes it worse.</p></div>
</div>
<div class="card tint"><h3>Consent, in plain words</h3><ul class="clean"><li><b>Freely given.</b> Not pressured, guilted or pushed.</li><li><b>Can be taken back</b> at any time, even if they said yes earlier.</li><li><b>Can’t be given</b> by someone who is very drunk, high, asleep or scared.</li><li><b>Not saying no isn’t the same as yes.</b> If you’re not sure, stop and check.</li></ul><p style="margin-top:8px">The same idea applies to photos and videos. People get to decide what happens to their body and their image.</p></div>
${supportBox('party')}
</section>
<section class="blk" style="--c:var(--m3)"><h2>Skill builder: the 4 Ds of stepping in</h2>

 <div class="q"><div class="n">D</div><h3>Direct</h3><p class="small muted">Say something to the person doing it. “Not cool. Stop.”</p></div>

 <div class="q"><div class="n">D</div><h3>Delegate</h3><p class="small muted">Get help: a friend, the host, a teacher, security, an adult.</p></div>
 <div class="q"><div class="n">D</div><h3>Delay</h3><p class="small muted">Check in with the person afterwards, and follow up with your friend.</p></div>
</div>
<p style="margin-top:14px">Which D would you use? Sometimes more than one works.</p>
${choiceAct('fourd',FOURD,['Direct','Distract','Delegate','Delay'])}
<h3 style="margin-top:22px">Be the second voice</h3>
<p>Both Turning Point endings happen because one friend backs up the person who spoke up. Which of these lines would help?</p>
${choiceAct('backup',BACKUP,['Helps','Doesn’t help'])}
</section>
${reflect('m3','What makes it hard for you to speak up to a friend? Which of the 4 Ds would you feel most able to use?')}
${quiz('friend')}

<section class="blk" style="--c:var(--m4)">
${hook('group','Someone posts an image in the group chat that’s clearly meant to humiliate a classmate. Most people react with laughing emojis. What would you most likely do?',['Nothing. Scroll past.','React so I don’t look weird.','Say something in the chat.','Message the person privately.'])}

 <div class="card"><h3>“It was a joke” doesn’t change it</h3><p>Adding a caption, sending it on silently, or just keeping it on your phone. All three make you part of it.</p></div>

${choiceAct('imgdo',IMGDO,['Do','Don’t'])}
${B('report',()=>`<div class="card tint"><h3>Where to report in ${CN[S.country]}</h3><ul class="clean">${REPORT[S.country].map(x=>`<li>${e(x)}</li>`).join('')}</ul></div>`)}

function modOnline(){return `
<div class="hero" style="--c:var(--m5)"><div class="kicker">Module 5</div><h1>Trust and safety online</h1><p class="lead">Online friendships can be real and good. They can also be built by someone who isn’t who they say they are. Here’s how to tell the difference, and how to stay safe either way.</p></div>
<section class="blk" style="--c:var(--m5)">
${hook('online','Someone you’ve been chatting with online for a month wants to meet. What’s your gut reaction?',['Exciting. I’d probably go.','I’d go, but bring someone.','I’d tell an adult first.','No way.'])}
${episode('stranger')}
</section>
<section class="blk" style="--c:var(--m5)"><h2>Unpack it</h2>
${endMap('stranger')}
<div class="grid2">
 <div class="card"><h3>Why it feels real so fast</h3><p>Chatting every day, sharing secrets, feeling understood. Online relationships can feel close quickly. That’s exactly what someone with bad intentions relies on.</p></div>
 <div class="card"><h3>People aren’t always who they say</h3><p>Photos can be stolen or AI-generated. Voices can be faked. Ages and names are easy to make up. Anyone who won’t video call deserves extra caution.</p></div>
 <div class="card"><h3>Telling an adult isn’t the end</h3><p>In Broken Trust, Leah asked for advice, then ignored it. Nothing might happen that night, but next time she needs help, it’s harder to ask.</p></div>
 <div class="card"><h3>Block and report</h3><p>Blocking protects you. Reporting protects the next person. Screenshot the chat, profile and username first, then report and block.</p></div>
</div></section>
<section class="blk" style="--c:var(--m5)"><h2>Skill builder: spot the warning signs</h2>
<p>Here’s a chat from someone Leah met online. Tap every message you think is a warning sign, then check.</p>
${B('chat',()=>{const sel=S.act.chat||{},chk=S.reveal.chat;let right=0;CHAT.forEach((c,i)=>{if(!!sel[i]===!!c[1])right++;});

${B('meet',()=>{const m=S.act.meet||{};return `<div class="card">${PLANITEMS.map((x,i)=>`<label style="display:flex;gap:10px;align-items:flex-start;padding:6px 0"><input type="checkbox" data-act="meet" data-i="${i}" ${m[i]?'checked':''} style="width:20px;height:20px;margin-top:3px"> <span>${e(x)}</span></label>`).join('')}${Object.keys(m).filter(k=>m[k]).length===PLANITEMS.length?'<p class="fb good">That’s a solid plan.</p>':''}</div>`;})}
<div class="card tint"><h3>If something has already gone wrong</h3><p>If someone is threatening you, asking for more photos, or asking for money after you sent something: <b>stop replying, don’t pay, screenshot everything, and tell a trusted adult or a service below.</b> It is not your fault, and you won’t get in trouble for asking for help.</p></div>
${supportBox('online')}
</section>
<section class="blk" style="--c:var(--m5)"><h2>AI chatbots and companion apps</h2>
<div class="card"><p>AI chatbots and “AI friend” apps can be fun and even useful. A few things to keep in mind:</p><ul class="clean"><li><b>What you type isn’t private.</b> Many apps store and use your chats. Don’t share your full name, school, address, photos or anything you wouldn’t want others to read.</li><li><b>They’re built to keep you talking.</b> An app that says it understands you better than your friends do is working to keep you on the app.</li><li><b>They can get things wrong</b>, including advice about serious stuff.</li><li><b>They can’t replace real people</b> who know you and can actually show up for you.</li></ul></div>

<h2>The four questions</h2><ol><li>What’s really going on here?</li><li>Who could be affected?</li><li>What are my options?</li><li>Who can help?</li></ol>
<h2>The 4 Ds</h2><p><b>Direct</b> (say something) · <b>Distract</b> (interrupt it) · <b>Delegate</b> (get help) · <b>Delay</b> (check in and follow up)</p>
<h2>Image consent check</h2><p>Did they know? Did they agree? Would they be OK with where it ends up?</p>
<h2>Get help: ${CN[S.country]}</h2><table>${sup}</table>
</body></html>`;}
function doPrint(){const w=window.open('','_blank');if(!w){toast('Pop-up blocked. Use Download instead.');return;}w.document.write(planHtml());w.document.close();setTimeout(()=>{try{w.focus();w.print();}catch(x){}},400);}
function doDownload(){try{const b=new Blob([planHtml()],{type:'text/html'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='My-Choices-plan.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);toast('Plan downloaded');}catch(x){toast('Download didn’t work here. Try Print instead.');}}

/* ---------- chrome + render ---------- */
const RENDER=[modStart,modHonesty,modFriend,modImages,modOnline,modTogether];
function chrome(){
 document.getElementById('bar').style.width=Math.round(MODS.filter(m=>S.done[m.id]).length/MODS.length*100)+'%';
 document.getElementById('tabs').innerHTML=MODS.map((m,i)=>`<button class="tab ${S.done[m.id]?'done':''}" style="--c:var(${m.c})" aria-current="${S.mod===i}" data-act="go" data-i="${i}"><span class="dot"></span>${i+1}. ${m.lbl}</button>`).join('');
 document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.country));
}
function render(){BL={};const m=MODS[S.mod];const main=document.getElementById('main');main.style.setProperty('--c',`var(${m.c})`);main.innerHTML=RENDER[S.mod]();chrome();
 const t=document.querySelector('.tab[aria-current="true"]');if(t)t.scrollIntoView({block:'nearest',inline:'center'});}
function helpBody(){document.getElementById('helpbody').innerHTML=`<p style="margin:10px 0 6px"><b>${CN[S.country]}</b> <button class="linkbtn" data-act="country" data-v="${S.country==='nz'?'au':'nz'}">Switch to ${CN[S.country==='nz'?'au':'nz']}</button></p><div class="tscroll"><table class="sup stack"><tbody>${SUP[S.country].map(r=>`<tr><td>${r[0]}</td><td>${r[2]}<br><span class="muted small">${r[1]}</span></td></tr>`).join('')}</tbody></table></div>`;}
let toastT;function toast(t){let el=document.querySelector('.toast');if(!el){el=document.createElement('div');el.className='toast';el.setAttribute('role','status');document.body.appendChild(el);}el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2400);}

function markFound(k,n,auto){if(!EP[k]||!NODES.includes(n))return;S.found[k]=S.found[k]||{};const had=!!S.found[k][n];S.found[k][n]=true;save();
 ['end-'+k,'map-'+k,'compare','found','patterns'].forEach(refresh);
 if(auto&&!had){const i=NODES.indexOf(n);toast('Ending found: '+EP[k].ends[i][0]);}}

/* ---------- events ---------- */
document.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const d=b.dataset,a=d.act;
 if(a==='go'){S.mod=+d.i;save();render();window.scrollTo({top:0});return;}
 if(a==='finish'){const i=+d.i;S.done[MODS[i].id]=true;if(i<MODS.length-1){S.mod=i+1;save();render();window.scrollTo({top:0});}else{save();refresh('cert');toast(isComplete()?'Course finished. Well done.':'Finish the other modules to complete the course.');b.textContent='Course finished ✓';}return;}
 if(a==='country'){S.country=d.v;save();refreshWhere(id=>/^(sup|law|report|cty)/.test(id));helpBody();return;}
 if(a==='help'){helpBody();const dl=document.getElementById('helpdlg');if(dl.showModal)dl.showModal();else dl.setAttribute('open','');return;}
 if(a==='closehelp'){document.getElementById('helpdlg').close();return;}
 if(a==='hook'){S.hook[d.id]=+d.i;save();refresh('hook-'+d.id);return;}
 if(a==='gate'){S.gate[d.k]=true;save();refresh('ep-'+d.k);return;}
 if(a==='summ'){S.summ[d.k]=!S.summ[d.k];save();refresh('ep-'+d.k);return;}
 if(a==='mark'){const f=S.found[d.k]=S.found[d.k]||{};if(f[d.n]){delete f[d.n];save();['end-'+d.k,'map-'+d.k,'compare','found','patterns'].forEach(refresh);}else markFound(d.k,d.n,false);return;}
 if(a==='showall'){S.showall[d.k]=!S.showall[d.k];save();refresh(d.k==='cmp'?'compare':'map-'+d.k);return;}
 if(a==='reveal'){S.reveal[d.id]=!S.reveal[d.id];save();refresh(d.id==='pattern'?'patterns':d.id);if(d.id==='pattern')b.textContent=S.reveal.pattern?'Hide the patterns':'Reveal the patterns';return;}
 if(a==='quiz'){const q=S.quiz[d.m]=S.quiz[d.m]||{};if(q[d.i]!=null)return;q[d.i]=+d.j;save();refresh(`q-${d.m}-${d.i}`);refresh('qs-'+d.m);return;}
 if(a==='retry'){S.quiz[d.m]={};save();QUIZ[d.m].forEach((_,i)=>refresh(`q-${d.m}-${i}`));refresh('qs-'+d.m);return;}
 if(a==='act'){const o=S.act[d.id]=S.act[d.id]||{};o[d.i]=+d.j;save();refresh(`${d.id}-${d.i}`);return;}
 if(a==='one'){S.act[d.id]=+d.j;save();refresh(d.id);return;}
 if(a==='mixed'){const o=S.act.mixed=S.act.mixed||{};if(o[d.i]!=null)return;o[d.i]=+d.j;save();refresh('mx-'+d.i);return;}
 if(a==='val'){const key=d.key,arr=S[key],v=d.v,i=arr.indexOf(v);if(i>=0)arr.splice(i,1);else if(arr.length<5)arr.push(v);else{toast('You can pick five. Unpick one first.');return;}save();refresh('vals-'+key);refresh('valcmp');return;}
 if(a==='chat'){const o=S.act.chat=S.act.chat||{};o[d.i]=!o[d.i];save();refresh('chat');return;}
 if(a==='chatcheck'){S.reveal.chat=true;save();refresh('chat');return;}
 if(a==='chatreset'){S.reveal.chat=false;S.act.chat={};save();refresh('chat');return;}
 if(a==='print'){doPrint();return;}
 if(a==='download'){doDownload();return;}
});
document.addEventListener('change',ev=>{const t=ev.target;
 if(t.dataset.act==='meet'){const m=S.act.meet=S.act.meet||{};m[t.dataset.i]=t.checked;save();refresh('meet');return;}
 if(t.dataset.plan){P.plan[t.dataset.plan]=t.value;savePriv();}});
document.addEventListener('input',ev=>{const t=ev.target;
 if(t.dataset.j){P.j[t.dataset.j]=t.value;savePriv();}
 else if(t.dataset.plan){P.plan[t.dataset.plan]=t.value;savePriv();}
 else if(t.dataset.guess){P.guess=t.value;savePriv();}});

/* messages from the embedded episodes (cbils.dev scenario player, ?embed=1) */
window.addEventListener('message',ev=>{if(!ORIGINS.includes(ev.origin))return;const m=ev.data;if(!m||typeof m!=='object')return;const k=STORY2EP[m.story];if(!k)return;
 if(m.type==='ethicslab:ending'&&m.nodeId)markFound(k,m.nodeId,true);
 if(m.type==='ethicslab:height'&&m.height){const f=document.getElementById('if-'+k);if(f)f.style.height=Math.max(420,Math.min(1400,Math.ceil(m.height)))+'px';}});

render();
if(window.LMS){LMS.getState().then(st=>{
 if(st&&typeof st==='object'){S=Object.assign(blank(),st);try{localStorage.setItem(KEY,JSON.stringify(S));}catch(x){}render();}
 else if(Object.keys(S.done).length||totalFound()){lmsSync();}
});}
})();
</script>
</body>
</html>
