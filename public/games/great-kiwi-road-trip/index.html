<html lang="en">

<title>The Great Kiwi Road Trip</title>

<style>
/* Layout: one column road-trip "logbook", sign-painted panels with hard ink shadows, map in the middle of each day */
:root{
  --ink:#1B2A2A; --green:#1E6B5E; --green-dk:#16514A; --yellow:#F4C542; --red:#D6453D;
  --sand:#E8D3A2; --sky:#7FB8D6; --mint:#DCEBE3; --paper:#FFF9EC; --muted:#4F625E;
  --good:#2E7D4F; --bad:#B23A30;
  --display:'Bungee', 'Arial Black', Impact, sans-serif;
  --body:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--mint);color:var(--ink)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:12px 40px}
.app{max-width:600px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h2{font-size:1.35rem}
h3{font-size:1.05rem}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:12px 14px}
.brand .title{font-family:var(--display);font-size:clamp(1.05rem,4.6vw,1.6rem);color:var(--yellow);text-shadow:2px 2px 0 var(--ink);line-height:1}
.brand .sub{font-size:.85rem;opacity:.95;margin-top:4px}
.btn{font-family:var(--body);font-weight:700;font-size:1rem;color:var(--ink);background:var(--yellow);border:3px solid var(--ink);border-radius:10px;box-shadow:3px 3px 0 var(--ink);padding:10px 16px;cursor:pointer;text-align:center;transition:transform .08s, box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-within,.choice:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none;box-shadow:3px 3px 0 var(--ink)}
.btn.small{font-size:.85rem;padding:6px 10px}
.btn.alt{background:var(--paper)}
.btn.go{background:var(--red);color:var(--paper)}
.btn.wide{width:100%}
.panel{background:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel.sand{background:var(--sand)}
.eyebrow{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}

/* status bar */
.status{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.stat{background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:6px 8px;min-width:0}
.stat .k{font-size:.66rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted)}
.stat .v{font-family:var(--display);font-size:1rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.bar{height:8px;border:2px solid var(--ink);border-radius:6px;background:var(--mint);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--green)}
.bar.warn i{background:var(--red)}
@media (max-width:480px){.status{grid-template-columns:repeat(3,1fr)}.stat:nth-child(n+4){grid-column:span 1}}

/* picker */
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:480px){.opts{grid-template-columns:1fr}}
.opts.two{grid-template-columns:repeat(2,1fr)}
@media (max-width:480px){.opts.two{grid-template-columns:1fr}}
.opt{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px;cursor:pointer;min-width:0}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt:has(input:checked){background:var(--yellow);box-shadow:3px 3px 0 var(--ink)}
.opt b{font-family:var(--display);font-weight:400;font-size:1rem}
.opt img{width:100%;height:84px;object-fit:contain}
.pic{display:block;width:100%;height:auto;max-width:100%;border:3px solid var(--ink);border-radius:10px;background:var(--sky)}
.card .pic{max-height:360px;object-fit:contain;background:var(--green-dk)}
.cover{display:block;width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink)}
.rider{width:96px;height:auto;flex:none}

/* road sign */
.signwrap{display:flex;gap:14px;align-items:center}
.sign{flex:none;width:70px;height:70px;transform:rotate(45deg);background:var(--yellow);border:4px solid var(--ink);border-radius:8px;display:grid;place-items:center;margin:12px}
.sign span{transform:rotate(-45deg);font-family:var(--display);font-size:.62rem;line-height:1.05;text-align:center;width:72px}
.sign.red{background:var(--red);color:var(--paper)}
.sign.green{background:var(--green);color:var(--paper)}

.choices{display:flex;flex-direction:column;gap:10px}
.choice{text-align:left;font:inherit;font-weight:700;background:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:12px 14px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);color:var(--ink)}
.choice:hover{background:var(--mint)}
.choice[disabled]{opacity:.45;cursor:not-allowed}
.choice .prev{display:block;font-weight:400;font-size:.9rem;margin-top:3px;color:var(--ink)}
.choice small{display:block;font-weight:400;color:var(--muted);margin-top:2px}

.verdict{font-family:var(--display);font-size:1rem;padding:4px 10px;border:3px solid var(--ink);border-radius:8px;align-self:flex-start}
.verdict.good{background:var(--good);color:var(--paper)}
.verdict.bad{background:var(--bad);color:var(--paper)}
.reflex{display:flex;flex-direction:column;gap:4px}
.reflex .bar{height:12px}
.reflex .bar i{transition:width .1s linear}
.choice.ticked{background:var(--mint);border-color:var(--green)}
.tk{display:grid;grid-template-columns:auto 1fr auto;gap:4px 8px;align-items:center;font-size:.88rem}
.tk .bar{margin:0}
.linkbtn{font:inherit;font-weight:700;color:var(--green-dk);background:none;border:0;padding:0;text-decoration:underline;cursor:pointer}
.tip{background:var(--mint);border:2px dashed var(--green);border-radius:10px;padding:10px 12px}
.tip b{color:var(--green-dk)}
.fx{display:flex;flex-wrap:wrap;gap:6px}
.fx span{font-size:.8rem;font-weight:700;background:var(--paper);border:2px solid var(--ink);border-radius:20px;padding:1px 9px;font-variant-numeric:tabular-nums}

/* place card */
.card{background:var(--green);color:var(--paper);border:3px solid var(--ink);border-radius:14px;box-shadow:4px 4px 0 var(--ink);padding:16px;display:flex;flex-direction:column;gap:8px}
.card .reo{font-family:var(--display);color:var(--yellow);font-size:1.4rem;text-shadow:2px 2px 0 var(--ink);line-height:1.1}
.card .badge{align-self:flex-start;background:var(--yellow);color:var(--ink);font-weight:700;font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;border:2px solid var(--ink);border-radius:20px;padding:2px 10px}

/* legs */
.legs{display:flex;flex-direction:column;gap:10px}
.leg{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--paper);border:3px solid var(--ink);border-radius:12px;padding:10px 12px}
.leg .nm{font-weight:700;font-size:1.05rem}
.leg .meta{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.tag{white-space:nowrap;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;border:2px solid var(--ink);border-radius:6px;padding:0 6px;background:var(--mint)}
.tag.main{background:var(--yellow)}
.tag.side{background:var(--sky)}
.tag.closed{background:var(--red);color:var(--paper)}
.leg.off{opacity:.6}

.mapbox{background:var(--sky);border:3px solid var(--ink);border-radius:14px;overflow:hidden}
.mapbox svg{display:block;width:100%;height:auto;max-height:440px}
.mapbox.small svg{max-height:200px}
.mapbox svg #vanpos{transition:none}
.vanmark{animation:bob 1.2s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.vanmark{animation:none}}
.postcard{border:3px solid var(--ink);border-radius:10px;overflow:hidden;background:var(--paper);display:flex;flex-direction:column;min-width:0}
.postcard img{display:block;width:100%;aspect-ratio:1/1;object-fit:cover;border-bottom:3px solid var(--ink)}
.postcard .pc{padding:8px 10px;display:flex;flex-direction:column;gap:2px}
.postcard .pc b{font-family:var(--display);font-weight:400;color:var(--green-dk)}
.postcard.locked{opacity:.55}
.postcard.locked .ph{aspect-ratio:1/1;background:var(--mint);display:grid;place-items:center;font-family:var(--display);color:var(--muted);border-bottom:3px solid var(--ink)}

.report{display:flex;flex-direction:column;gap:6px}
.report .line{display:flex;gap:8px;align-items:baseline}
.banner{background:var(--red);color:var(--paper);border:3px solid var(--ink);border-radius:10px;padding:10px 12px;font-weight:700}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(27,42,42,.6);display:flex;align-items:flex-start;justify-content:center;padding:calc(20px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) 20px max(16px, env(safe-area-inset-left,0px));overflow:auto;z-index:20}
.overlay .panel{max-width:600px;width:100%}
.tripmap{display:block;width:100%;max-width:420px;height:auto;margin:0 auto;border:3px solid var(--ink);border-radius:12px}
.atlas{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:420px){.atlas{grid-template-columns:1fr}}
.acard{border:3px solid var(--ink);border-radius:10px;padding:10px;background:var(--green);color:var(--paper);min-width:0}
.acard b{font-family:var(--display);font-weight:400;color:var(--yellow);display:block}
.acard.locked{background:var(--mint);color:var(--muted)}
.acard.locked b{color:var(--muted)}
.acard.secret{background:var(--red)}

.hero{display:flex;flex-direction:column;gap:12px}
.hero svg{width:100%;height:auto;border:3px solid var(--ink);border-radius:14px;background:var(--sky)}
.stars{font-family:var(--display);font-size:1.8rem;color:var(--yellow);text-shadow:2px 2px 0 var(--ink);letter-spacing:.1em}
canvas#sky{width:100%;height:240px;display:block;border:3px solid var(--ink);border-radius:14px;background:#0B1A2A}
ul.clean{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
@media (prefers-reduced-motion:reduce){.btn,.choice{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand"><div class="title">The Great Kiwi Road Trip</div><div class="sub">Cape Reinga to Bluff · Leg 1: Te Tai Tokerau Northland</div></div>
    <button id="atlasBtn" class="btn small" type="button">Scrapbook</button>
  </header>
  <div id="status" class="status" hidden></div>
  <main id="screen"></main>
</div>

<div id="more" class="overlay" hidden>
  <div class="panel">
    <div class="row" style="justify-content:flex-end"><button class="btn small alt" id="moreClose" type="button">Close</button></div>
    <div id="moreBody" class="stack"></div>
  </div>
</div>
<div id="atlas" class="overlay" hidden>
  <div class="panel">
    <div class="row" style="justify-content:space-between"><h2>Trip scrapbook</h2><button class="btn small alt" id="atlasClose" type="button">Close</button></div>
    <div id="atlasMaps" class="stack"></div>
    <p class="small muted">Each place you visit becomes a postcard. Tap one to read more. Red cards are secret spots and bonus trips.</p>
    <div id="atlasGrid" class="atlas"></div>
  </div>
</div>

<script>
/* ---------- DATA ---------- */
const VEH = {
  car:{name:'Hatchback', blurb:'Quick and cheap to run. Needs a bed or campsite each night.', lp100:7, tank:45, speed:{main:85,back:65,winding:45}, fatMul:1, ferry:20},
  van:{name:'Campervan', blurb:'Certified self-contained, so you can freedom camp where it is allowed. Slow and thirsty.', lp100:12, tank:80, speed:{main:75,back:55,winding:38}, fatMul:1.1, ferry:35},
  scooter:{name:'Scooter', blurb:'Small tank, small tent, cheap to run. Main roads belong to trucks, so pick your times.', lp100:2.5, tank:6, speed:{main:60,back:50,winding:40}, fatMul:1.5, ferry:10}
};
const MONTHS = {
  jan:{name:'January', season:'Summer', dusk:21, wx:[60,30,10], note:'Kiwi summer holidays. Long days, strong sun, busy campsites.'},
  oct:{name:'October', season:'Spring', dusk:19.5, wx:[40,40,20], note:'Spring. Mixed weather and quieter roads.'},
  jul:{name:'July', season:'Winter', dusk:17.5, wx:[30,40,30], note:'Northern summer holidays, but here it is winter. Short days, more rain, more slips.'}
};
const WX = {fine:'Fine and sunny', showers:'Showers about', heavy:'Heavy rain warning'};
const STAYS = {
  doc:{name:'DOC campsite', desc:'Long-drop toilets and cold water. Cheap, quiet, close to nature.', cost:{car:18,van:18,scooter:15}, rest:45},
  park:{name:'Holiday park', desc:'Hot showers, a shared kitchen and a laundry.', cost:{car:75,van:60,scooter:30}, rest:60, note:{car:'cabin',van:'powered site',scooter:'tent site'}},
  backpackers:{name:'Backpackers', desc:'A bunk in a shared room.', cost:{car:42,van:42,scooter:42}, rest:50},
  motel:{name:'Motel', desc:'Your own room, a proper bed and a long hot shower.', cost:{car:140,van:140,scooter:140}, rest:75},
  freeOK:{name:'Freedom camping area', desc:'Free. Council sign says: certified self-contained vehicles only.', cost:{car:0,van:0,scooter:0}, rest:40},
  farm:{name:'Farm stay', desc:'Free bed and dinner with a farming family, if you help with the 5am milking. Once per trip.', cost:{car:0,van:0,scooter:0}, rest:50},
  marae:{name:'Marae stay', desc:'A local whānau welcomes travellers to stay. Everyone sleeps together in the wharenui. Bed and food covered; bring a koha.', cost:{car:20,van:20,scooter:20}, rest:25, note:{car:'koha',van:'koha',scooter:'koha'}},
  freeNO:{name:'Free waterfront park-up', desc:'Free, and a few other vans are already here. There is a small sign near the toilets.', cost:{car:0,van:0,scooter:0}, rest:40}
};
const FOOD = 30;

const NODES1 = {
  cape:{name:'Cape Reinga', img:'cape', reo:'Te Rerenga Wairua', mean:'The leaping place of the spirits. In Māori tradition, spirits travel here and leave the land down the roots of an old pōhutukawa on the headland.', x:52,y:32, lx:8,ly:-8, station:false, spine:true, stays:['doc'],
    acts:[
      {id:'light', name:'Walk to the lighthouse', cost:0, fat:8, kh:2, text:'A 20 minute walk down to the lighthouse. Below you, the Tasman Sea meets the Pacific Ocean and you can see the two currents clash.',
        quiz:{q:'You packed lunch. Where do you eat it?', opts:[
          {l:'Back at the car park', good:true, r:'Right call. Local iwi ask visitors not to eat or drink at the headland because this is a sacred place.'},
          {l:'At the lighthouse, with the view', good:false, r:'A ranger quietly explains that iwi ask people not to eat or drink at the headland. It is a sacred place.'}]},
        tip:'Te Rerenga Wairua is one of the most sacred sites in Māori culture. Respect the signs: no food or drink at the headland.'},
      {id:'dunes', name:'Sandboard the Te Paki dunes', cost:15, fat:18, kh:1, text:'Giant golden sand dunes just south of the Cape. You hire a board, climb for ten minutes, and fly down on your belly in ten seconds.', tip:'Take water. The sand gets very hot in summer and there is no shade.'}
    ]},
  beach:{name:'Ninety Mile Beach', short:'Ninety Mile', img:'beach', reo:'Te Oneroa-a-Tōhē', mean:'The long beach of Tōhē, an ancestor who walked this coast. It is about 88 km long, so the English name is a stretch.', x:62,y:116, lx:-12,ly:4, anchor:'end', station:false, spine:false, stays:['park','backpackers'],
    acts:[
      {id:'bus', name:'Beach bus tour', cost:65, fat:4, kh:2, text:'Your rental agreement does not cover beach driving, so you join a tour bus. The driver times the run with the tide and stops for sandboarding and a swim.',
        quiz:{q:'The beach is officially a highway. Why do most rental companies ban driving on it?', opts:[
          {l:'Soft sand and incoming tides trap cars', good:true, r:'Yes. Every year vehicles get stuck and lost to the tide.'},
          {l:'The beach is only for buses', good:false, r:'Not quite. Anyone can legally drive it, but soft sand and tides trap cars, so rentals ban it.'}]},
        tip:'Always check tide times before going on a beach. Never drive a rental on the sand.'},
      {id:'wreck', name:'Sunset at Shipwreck Bay', cost:0, fat:2, kh:1, text:'At Ahipara, the southern end of the beach. Surfers ride the long left-hand waves and you can spot old wreckage at low tide.', tip:'Swim between the flags at patrolled beaches. Rips on the west coast are strong.'}
    ]},
  kaitaia:{name:'Kaitāia', img:'kaitaia', reo:'Kaitāia', mean:'Often translated as "plentiful food". Kai means food, a word you will hear all over the country.', x:90,y:122, lx:8,ly:4, station:true, spine:true, stays:['park','motel','farm'],
    acts:[
      {id:'pubquiz', img:'pubquiz', name:'Quiz night at the local pub', cost:5, fat:3, kh:0, pubquiz:true, text:'Five questions, prize money for every right answer. The locals are fierce.', tip:'Pub quiz night is a weekly ritual in towns all over New Zealand.'},
      {id:'pie', name:'Pie at the bakery', cost:6, fat:-6, kh:1, text:'A mince and cheese pie, straight from the warmer. The classic Kiwi road-trip lunch.',
        quiz:{q:'Your pie is steaming hot. What do you do?', opts:[
          {l:'Blow on the pie', good:true, r:'Always blow on the pie. Kiwis learn this young.'},
          {l:'Take a big bite', good:false, r:'Molten mince. You burn the roof of your mouth. Always blow on the pie.'}]},
        tip:'Every small town has a bakery. The pie is a national institution.'},
      {id:'museum', name:'Local history museum', cost:10, fat:4, kh:2, text:'You learn about Te Hiku, the Far North, and its Māori, Dalmatian and settler history, including the gum diggers who dug for kauri gum in the swamps.', tip:'Many Croatian (Dalmatian) families settled in the Far North in the 1800s to dig kauri gum.'}
    ]},
  hokianga:{name:'Ōpononi, Hokianga', img:'wharf', reo:'Hokianga-nui-a-Kupe', mean:'The great returning place of Kupe. Tradition says the Polynesian navigator Kupe left from this harbour to return to Hawaiki.', x:98,y:200, lx:-12,ly:4, anchor:'end', station:true, remote:true, spine:false, stays:['park','motel','freeOK','marae'],
    acts:[
      {id:'wharf', name:'Fish off the wharf', cost:0, fat:4, kh:1, invite:'koutu', text:'You throw a line off the Ōpononi wharf as the tide comes in. A local at the next rod starts chatting about the harbour.', tip:'Recreational fishing has daily catch limits and minimum sizes. Check the rules for the area.'},
      {id:'opo', name:'Opo the dolphin statue', cost:0, fat:2, kh:2, text:'In the summer of 1955 and 1956 a wild bottlenose dolphin named Opo played with swimmers here and became famous across the country. People still talk about her.', tip:'Today, the rule for wild dolphins is look, don\'t touch, and let them come to you.'},
      {id:'dunes', name:'Water taxi to the sand dunes', cost:30, fat:14, kh:1, text:'Huge dunes across the harbour mouth. You climb up, slide down, and watch the bar where the harbour meets the open sea.', tip:'The Hokianga harbour bar is dangerous for small boats. Locals cross it only with good local knowledge.'}
    ]},
  waipoua:{name:'Waipoua Forest', img:'waipoua', reo:'Tāne Mahuta', mean:'Lord of the Forest. Tāne is the atua (god) of forests and birds. This kauri is the largest known living kauri tree.', x:116,y:230, lx:-12,ly:6, anchor:'end', station:false, spine:false, stays:['doc'],
    acts:[
      {id:'tane', name:'Walk to Tāne Mahuta', cost:0, fat:4, kh:3, text:'A short boardwalk through the forest, then the giant appears. It is about 50 metres tall and estimated to be well over a thousand years old.',
        quiz:{q:'At the track entrance there is a cleaning station with brushes and spray. What do you do?', opts:[
          {l:'Scrub and spray your shoes', good:true, r:'Exactly. Kauri dieback spreads in soil on shoes. Cleaning protects these trees.'},
          {l:'Walk past, your shoes look clean', good:false, r:'Kauri dieback spreads in tiny amounts of soil you can\'t see. Always clean your shoes.'}]},
        tip:'Kauri dieback disease has no cure. Clean your gear and stay on the boardwalk so you don\'t damage the shallow roots.'},
      {id:'night', name:'Guided night walk', cost:95, fat:14, kh:3, text:'A local guide shares stories of the forest by torchlight. A ruru (morepork) calls from the dark.', tip:'Ruru are small native owls. Their call sounds like "more-pork".'}
    ]},
  paihia:{name:'Paihia, Bay of Islands', img:'paihia', reo:'Pēwhairangi', mean:'The Māori name for the Bay of Islands. Paihia itself is said to come from a missionary mixing Māori and English: pai (good) and "here".', x:184,y:140, lx:-12,ly:-8, anchor:'end', station:true, spine:true, stays:['park','backpackers','motel','freeNO','marae'],

  eastcape:{name:'East Cape', img:'eastcape', reo:'Te Tairāwhiti', mean:'The coast upon which the sun shines across the water. East Cape is one of the first places in the world to see the sun each day.', x:320,y:110, lx:-6,ly:-10, anchor:'end', station:true, remote:true, spine:false, stays:['doc','park','marae'],
    acts:[
      {id:'light', name:'Climb to the lighthouse', cost:0, fat:18, kh:3, text:'About 700 steps up a steep hill to the most easterly lighthouse in the country. Locals say get there before dawn to be among the first to see the sun.', tip:'The road out to the lighthouse is narrow gravel. Take it slow.'},
      {id:'tree', name:'See Te Waha o Rerekohu', cost:0, fat:2, kh:2, text:'In the grounds of the school at Te Araroa stands one of the largest pōhutukawa trees in the country, said to be over 600 years old.', tip:'It\'s on school grounds. Look respectfully from the gate.'}
    ]},
  gisborne:{name:'Gisborne', img:'gisborne', reo:'Tūranganui-a-Kiwa', mean:'The great standing place of Kiwa. In 1769 the Endeavour landed here and Cook\'s crew first met Māori, a meeting that turned deadly for local Māori.', x:298,y:178, lx:-12,ly:4, anchor:'end', station:true, spine:false, stays:['park','motel','freeOK'],
    acts:[

        quiz:{q:'You\'ve had four tastings and plan to drive to Napier this afternoon. What now?', opts:[
          {l:'Wait several hours or stay the night before driving', good:true, r:'Smart. Only time sobers you up.'},
          {l:'Drink water and a coffee, then drive', good:false, r:'Water and coffee don\'t sober you up. Only time does.'}]},
        tip:'Gisborne is known for chardonnay. When tasting, use the spit bucket or have a sober driver.'},
      {id:'pubquiz', img:'pubquiz', name:'Quiz night at the local pub', cost:5, fat:3, kh:0, pubquiz:true, text:'Five questions, prize money for every right answer. The locals are fierce.', tip:'Pub quiz night is a weekly ritual in towns all over New Zealand.'},
      {id:'titirangi', name:'Sunrise from Titirangi lookout', cost:0, fat:4, kh:2, text:'From the hill above the city you watch the sun come up over Poverty Bay.', tip:'Gisborne is one of the first cities in the world to see the sun each day.'}
    ]},
  napier:{name:'Napier', img:'napier', reo:'Ahuriri', mean:'The Māori name for Napier and its harbour, after the ancestor Tū Ahuriri.', x:258,y:250, lx:-12,ly:4, anchor:'end', station:true, spine:false, stays:['park','backpackers','motel'],
    acts:[
      {id:'deco', name:'Art Deco walking tour', cost:25, fat:6, kh:3, text:'Pastel buildings with zigzags, sunbursts and chrome lettering line the streets. Some guides drive vintage cars.',
        quiz:{q:'Why is Napier full of Art Deco buildings?', opts:[
          {l:'The city was rebuilt after a huge earthquake in 1931', good:true, r:'Correct. Napier was rebuilt in the style of the day.'},
          {l:'A rich family loved the style', good:false, r:'It was the 1931 earthquake. The city was rebuilt in the style of the day.'},
          {l:'It was built as a film set', good:false, r:'It was the 1931 earthquake. The city was rebuilt in the style of the day.'}]},
        tip:'The 1931 Hawke\'s Bay earthquake killed 256 people and lifted the seabed so much that new land appeared.'},
      {id:'bikes', name:'Cycle the Hawke\'s Bay wineries', cost:60, fat:15, kh:2, text:'Flat cycle trails link the vineyards. You ride from cellar door to cellar door with a picnic lunch.',
        quiz:{q:'You\'re cycling between vineyards. How do you handle the tastings?', opts:[
          {l:'A few small tastings, use the spit bucket, drink plenty of water', good:true, r:'Good plan. You ride home steady and happy.'},
          {l:'Have as many as you like, you\'re on a bike', good:false, r:'You wobble into a ditch on the way home. Riding a bike drunk is dangerous.'}]},
        tip:'Hawke\'s Bay is one of the country\'s oldest wine regions, known for its red wines.'}
    ]},
  raglan:{name:'Raglan', img:'raglan', reo:'Whāingaroa', mean:'Often translated as "the long pursuit". Raglan is famous for one of the longest left-hand surf breaks in the world.', x:96,y:92, lx:8,ly:4, station:true, spine:false, stays:['park','backpackers','motel'],
    acts:[
      {id:'surf', name:'Surf lesson at Ngarunui Beach', cost:90, fat:20, kh:2, text:'Two hours in a wetsuit, falling off a big foam board, and finally standing up for three whole seconds.', tip:'Learn at a patrolled beach between the flags. The famous point breaks are for experienced surfers.'},
      {id:'falls', name:'Bridal Veil Falls', cost:0, fat:6, kh:1, text:'A 55 metre waterfall pours over a basalt cliff into a pool in the bush.', tip:'Its Māori name is Waireinga, the leaping waters.'},
      {id:'wharf', name:'Fish off the Raglan wharf', cost:0, fat:4, kh:1, invite:'karioi', text:'You drop a line off the old wharf as the tide turns. A local beside you starts telling you about the harbour.', tip:'Recreational fishing has daily catch limits and minimum sizes. Check the rules for the area.'}
    ]},
  waitomo:{name:'Waitomo', img:'waitomo', reo:'Waitomo', mean:'Wai means water and tomo means a hole or shaft: water flowing into the ground. Underneath are hundreds of limestone caves.', x:122,y:140, lx:8,ly:4, station:true, spine:true, stays:['park','backpackers','motel'],
    acts:[
      {id:'blackwater', name:'Black water rafting', cost:150, fat:22, kh:3, text:'Wetsuit, helmet and a rubber tube. You float down an underground river in the dark, then switch off your headlamps and look up at a ceiling of glowworms.', tip:'Glowworms aren\'t worms. They are the larvae of a fungus gnat, glowing to lure insects into sticky threads.'},
      {id:'glow', name:'Glowworm cave boat ride', cost:60, fat:3, kh:2, text:'A guide pulls the boat along a rope in total darkness under thousands of tiny blue-green lights.',
        quiz:{q:'The guide says noise and bright light make the glowworms switch off. What do you do?', opts:[
          {l:'Stay silent and keep your phone away', good:true, r:'The whole ceiling glows like a starry sky.'},
          {l:'Sneak a quick flash photo', good:false, r:'The flash dims part of the ceiling and the guide is not impressed. No photos, no noise.'}]},
        tip:'Caves are fragile. Don\'t touch the formations; skin oils stop them growing.'}
    ]},
  rotorua:{name:'Rotorua', img:'rotorua', reo:'Te Rotorua-nui-a-Kahumatamomoe', mean:'Rotorua means "second lake". The full name honours Kahumatamomoe, of the Te Arawa people, who explored here.', x:214,y:142, lx:8,ly:4, station:true, spine:false, stays:['park','backpackers','motel','marae'],
    acts:[
      {id:'mud', name:'Geothermal mud bath', cost:85, fat:-15, kh:2, text:'You sink into warm, silky grey mud, then soak in a hot sulphur pool. Your skin has never felt so soft.', tip:'The rotten-egg smell around town is hydrogen sulphide from the geothermal activity. You stop noticing it after a day.'},
      {id:'village', name:'Living Māori village and hāngī', cost:75, fat:6, kh:4, text:'At a village where whānau have lived among the geysers for generations, a guide shows you how food is cooked in steam vents and boiling pools. Dinner is a hāngī, cooked in the ground.',
        quiz:{q:'The path crosses an area of steaming ground. Where do you walk?', opts:[
          {l:'Only on the marked path', good:true, r:'Right. The crust can be thin with boiling water underneath.'},
          {l:'Off the path for a closer look at a bubbling pool', good:false, r:'The ground here can be a thin crust over boiling water. Stay on the marked path.'}]},
        tip:'Never leave marked paths in geothermal areas. People have been badly burned.'}
    ]},
  taupo:{name:'Taupō', img:'taupo', reo:'Taupō-nui-a-Tia', mean:'The great cloak of Tia. Lake Taupō fills the crater of a supervolcano whose eruption about 1,800 years ago was one of the biggest on Earth in thousands of years.', x:196,y:190, lx:8,ly:4, station:true, spine:false, stays:['park','backpackers','motel','freeOK'],
    acts:[
      {id:'huka', name:'Huka Falls', cost:0, fat:4, kh:1, text:'The whole Waikato River squeezes through a narrow chasm and blasts over the falls in bright blue and white.', tip:'Huka means foam.'},
      {id:'hotfalls', name:'Chat with locals at the lakefront', cost:0, fat:4, kh:3, secret:'hotfalls', text:'A local tells you about a spot visitors usually miss and walks you down to it: a hot stream tumbling over a little waterfall into the cold Waikato River. You sit in the warm water while the river rushes past.',
        quiz:{q:'Before you get in, your local guide gives you one rule for natural hot pools. What is it?', opts:[
          {l:'Keep your head above the water', good:true, r:'That\'s the one. Some geothermal water carries a rare amoeba that can be deadly if it gets up your nose.'},
          {l:'Dunk under to warm your ears', good:false, r:'Never put your head under. Some geothermal water carries a rare amoeba that can be deadly if it gets up your nose.'}]},
        tip:'Keep your head above water in natural hot pools all over the North Island.'}
    ]},
  tongariro:{name:'Tongariro', img:'tongariro', reo:'Tongariro', mean:'The country\'s first national park. In 1887 Ngāti Tūwharetoa paramount chief Te Heuheu Tūkino IV gifted the sacred peaks so they would be protected for everyone.', x:172,y:226, lx:8,ly:4, station:true, remote:true, spine:false, stays:['doc','backpackers','motel'],
    acts:[
      {id:'crossing', name:'Tongariro Alpine Crossing', cost:45, day:1, fat:40, kh:4, text:'19.4 km across an active volcanic landscape: the Red Crater, steaming vents and the bright Emerald Lakes, with Ngāuruhoe towering beside you. It takes the whole day.',
        quiz:{q:'What do you pack for the crossing?', opts:[
          {l:'Warm layers, rain jacket, hat, food, water and a map', good:true, r:'Good. Near the top it is cold and windy even in summer.'},

        tip:'Mountain weather changes fast. Check the forecast, start early, and turn back if it turns bad. Book your shuttle ahead.'},
      {id:'taranakifalls', name:'Walk to Taranaki Falls', cost:0, fat:8, kh:1, text:'A loop track across tussock to a 20 metre waterfall pouring off an old lava flow on Ruapehu.', tip:'Ruapehu is an active volcano and the North Island\'s highest mountain, with ski fields in winter.'}
    ]},
  taihape:{name:'Taihape', img:'taihape', reo:'Taihape', mean:'The Gumboot Capital of the World. A giant corrugated iron gumboot stands on the main street.', x:184,y:268, lx:8,ly:4, station:true, spine:false, stays:['park','motel','farm'],

      {id:'pie', name:'Pie at the main street bakery', cost:6, fat:-6, kh:1, text:'Steak and cheese this time, and you remember the rule.',

        tip:'Small-town bakeries enter the national pie awards every year.'}
    ]},
  river:{name:'Taumarunui', short:'Taumarunui', img:'river', reo:'Te Awa Tupua', mean:'The Whanganui River. In 2017 it became the first river in the world recognised in law as a living being with its own rights. Iwi say: "I am the river, and the river is me."', x:142,y:196, lx:-10,ly:-7, anchor:'end', station:true, spine:false, stays:['doc','park','marae'],
    acts:[
      {id:'canoe', name:'Canoe down the Whanganui River', cost:160, day:1, fat:30, kh:4, text:'You paddle a Canadian canoe down through deep green gorges, past waterfalls and the track to the Bridge to Nowhere, and camp on the riverbank. At the take-out the canoe company\'s crew are waiting with a van to drive you all the way back to your vehicle.',
        quiz:{q:'Your canoe tips over in a rapid. What do you do?', opts:[
          {l:'Hold on to the canoe and float on your back, feet downstream', good:true, r:'Exactly. You drift into calm water and climb back in, laughing.'},
          {l:'Stand up and try to walk out', good:false, r:'Standing in fast water can trap your foot under a rock. Float on your back, feet first.'}]},
        tip:'The Whanganui Journey is one of the Great Walks, even though you paddle it. Huts and campsites must be booked ahead.'}
    ]},
  whangamomona:{name:'Whangamōmona', img:'whangamomona', reo:'Republic of Whangamōmona', mean:'In 1989 this tiny town declared itself a republic after a boundary change it didn\'t like. It still holds Republic Day with a street party.', x:102,y:236, lx:8,ly:6, station:false, spine:false, stays:['doc','motel'],
    acts:[
      {id:'stamp', name:'Get a Republic passport stamped', cost:5, fat:0, kh:2, text:'At the old hotel you buy a souvenir Whangamōmona passport and the publican stamps it with great ceremony.', tip:'There is no fuel for a long stretch of the Forgotten World Highway. Fill up before you leave Stratford or Taumarunui.'},
      {id:'railcart', name:'Rail cart along the old railway', cost:120, fat:8, kh:3, text:'You drive a modified golf cart on rails along a closed railway line, through dark tunnels and over high bridges deep in the hill country.', tip:'The line closed to trains and was given a second life for visitors. Many of its tunnels were dug by hand.'}
    ]},
  newplymouth:{name:'New Plymouth', short:'New Plymouth', img:'newplymouth', reo:'Ngāmotu', mean:'The islands, after the Sugar Loaf Islands offshore. Above the city stands Taranaki Maunga, recognised in law in 2025 as a living ancestor with its own legal personhood.', x:60,y:212, lx:4,ly:18, station:true, spine:true, stays:['park','backpackers','motel','freeOK'],

      {id:'surfhwy', name:'Drive Surf Highway 45', cost:0, fat:6, kh:1, text:'The coast road around the maunga, past surf breaks, farmland and little beach towns.', tip:'In clear weather the maunga is visible from almost every point on the road.'}
    ]},
  whanganui:{name:'Whanganui', img:'whanganui', reo:'Whanganui', mean:'Big harbour or wide estuary. In 2015 the city\'s official name gained an "h" to match the Māori spelling.', x:122,y:302, lx:8,ly:4, station:true, spine:true, stays:['park','motel','marae'],
    acts:[
      {id:'pubquiz', img:'pubquiz', name:'Quiz night at the local pub', cost:5, fat:3, kh:0, pubquiz:true, text:'Five questions, prize money for every right answer. The locals are fierce.', tip:'Pub quiz night is a weekly ritual in towns all over New Zealand.'},
      {id:'elevator', name:'Ride the Durie Hill elevator', cost:4, fat:2, kh:2, text:'You walk through a tunnel into the hill, then an old elevator lifts you 66 metres up inside it. It has carried people since 1919.', tip:'From the tower at the top you can see Ruapehu and Taranaki on a clear day.'},

  fairlie:{name:"Fairlie", img:"fairlie", reo:"Fairlie", mean:"Gateway to the Mackenzie Basin, a small town famous across the country for one bakery and its pies.", x:212,y:90, lx:8,ly:4, station:true, spine:true, stays:["park","motel","farm"],

  aoraki:{name:"Aoraki / Mount Cook", short:"Aoraki", img:"aoraki", reo:"Aoraki", mean:"The highest mountain in New Zealand, at 3,724 metres. To Ngāi Tahu, Aoraki is their most sacred ancestor, a boy turned to stone with his brothers when their canoe ran aground.", x:150,y:62, lx:-10,ly:-6, anchor:"end", station:false, spine:false, stays:["doc","backpackers","motel"],
    acts:[

  omarama:{name:"Ōmārama", img:"omarama", reo:"Ōmārama", mean:"Often given as \"place of light\". A small town at the meeting of high country roads, known for gliding, as rising air currents here are among the best in the world.", x:166,y:146, lx:-30,ly:18, station:true, spine:true, stays:["park","motel","farm"],

  doubtful:{name:"Manapōuri and Doubtful Sound", short:"Doubtful Sound", img:"doubtful", reo:"Patea", mean:"Patea, \"the place of silence\". Captain Cook named it Doubtful Harbour in 1770 because he doubted he could sail back out.", x:40,y:262, lx:8,ly:6, station:true, remote:true, spine:false, stays:["park","backpackers","motel"],

  gemstone:{name:"Gemstone Beach and Riverton", short:"Gemstone Beach", img:"gemstone", reo:"Aparima", mean:"Aparima, the Māori name for Riverton, one of the oldest European settlements in the country, started as a whaling station in the 1830s.", x:92,y:312, lx:-30,ly:20, station:true, spine:false, stays:["park","motel"],

  if(g&&goal===LEG().goal&&!gateOpen()&&!g.includes(from)) return Math.min(...g.map(f=>bfs(from,f)+bfs(f,goal)));
  return bfs(from,goal);
}

}

function rollDay(){
  const m=MONTHS[S.month]; const r=rnd()*100;
  S.weather = r<m.wx[0]?'fine':r<m.wx[0]+m.wx[1]?'showers':'heavy';
  S.closed=[];
  const closable=EDGES.filter(e=>e.type==='winding'||e.type==='back');
  if(S.weather==='heavy'&&rnd()<.7) S.closed.push(closable[Math.floor(rnd()*closable.length)].id);
  if(S.weather==='showers'&&S.month==='jul'&&rnd()<.25) S.closed.push(closable[Math.floor(rnd()*closable.length)].id);
  S.closeWhy={};
  for(const e of EDGES){ if(e.snow&&e.snow[S.month]&&rnd()<e.snow[S.month]&&!S.closed.includes(e.id)){S.closed.push(e.id);S.closeWhy[e.id]='snow'} }
  S.px={};
  for(const k of NODE_ORDER){const n=NODES[k]; S.px[k]=+(2.85+(n.station?(n.remote?.3:0):1.1)+(rnd()-.5)*.3).toFixed(2)}
  S.invited=false; S.ords={};
}
function collect(id){ if(!S.cards.includes(id)){S.cards.push(id);S.newCard=id} else S.newCard=null }
function legInfo(e){
  const v=VEH[S.veh]; let hrs,cost=0;
  if(e.type==='ferry'){hrs=.75;cost=v.ferry}else hrs=e.km/v.speed[e.type];
  const fuelL=e.km*v.lp100/100;
  let fat=hrs*11*v.fatMul*(e.type==='winding'?1.3:1);
  if(S.veh==='scooter'&&S.weather!=='fine')fat+=10;
  if(S.month==='jul')fat+=4;
  return {hrs,fuelL,cost,fat:Math.round(fat)};
}
function apply(e){
  if(!e)return;
  if(e.money)S.money+=e.money;
  if(e.fat)S.fat=clamp(S.fat+e.fat,0,100);
  if(e.kh)S.kh=Math.max(0,S.kh+e.kh);
  if(e.hours&&S.drive)S.drive.arrive+=e.hours;
  if(e.day)S.day+=e.day;
  if(e.end)S.over=e.end;
}
function fx(e){
  if(!e)return '';
  const out=[];
  if(e.money)out.push((e.money>0?'+':'')+money(e.money));
  if(e.kh)out.push((e.kh>0?'+':'')+e.kh+' know-how');
  if(e.fat)out.push((e.fat>0?'+':'')+e.fat+' fatigue');
  if(e.hours)out.push('+'+hm(e.hours));
  if(e.day)out.push('+'+e.day+' day');
  return out.length?'<div class="fx">'+out.map(x=>'<span>'+x+'</span>').join('')+'</div>':'';
}

function startGame(){ wipe(); newGame(); }
function chooseLeg(id){
  const e=EDGES[id];
  if(S.veh==='scooter'&&e.type==='main'&&!S.keepGoing){S.pendingLeg=id;S.phase='scooterTime';return go()}
  drive(id,S.keepGoing?(S.clock||S.drive.arrive):9);
}
function drive(id,dep){
  const e=EDGES[id], L=legInfo(e), to=e.a===S.loc?e.b:e.a;
  const second=S.keepGoing; S.keepGoing=false; S.toast=null;
  if(second)L.fat+=10;
  S.fuel=Math.max(0,S.fuel-L.fuelL); S.money-=L.cost;
  S.fat=clamp(S.fat+L.fat+(dep<8?6:0),0,100);
  const arrive=dep+L.hrs, night=arrive>MONTHS[S.month].dusk;
  const c={leg:S.leg||1,second,type:e.type,water:e.water,night,veh:S.veh,season:S.month,weather:S.weather,fat:S.fat};
  const n=e.km<40?1:2; const evs=[];
  if(S.veh==='scooter'&&e.type==='main'&&dep>=8)evs.push('scootertruck');
  if(second&&S.fat>=55&&!evs.includes('tired'))evs.push('tired');
  while(evs.length<n){
    const pool=EVENTS.filter(x=>x.when(c)&&!evs.includes(x.id));
    if(!pool.length)break;
    const ws=pool.map(x=>x.w(c)/Math.pow(1+(S.seen[x.id]||0),2));
    let r=rnd()*ws.reduce((a,b)=>a+b,0),i=0;
    while(r>ws[i]&&i<ws.length-1){r-=ws[i];i++}
    evs.push(pool[i].id);
  }
  evs.forEach(x=>S.seen[x]=(S.seen[x]||0)+1);
  S.drive={id,to,dep,arrive,night,evs,i:0,ctx:c,cost:L.cost,fuelL:L.fuelL,from:S.loc};
  S.trails=S.trails||{}; (S.trails[S.leg||1]=S.trails[S.leg||1]||[]); if(!S.trails[S.leg||1].includes(id)) S.trails[S.leg||1].push(id);
  const ne=evs.length;
  S.drive.tA=0; S.drive.tB=ne?1/(ne+1):1; S.drive.after=ne?'event':'arrive';
  S.phase='travel'; go();
}
let travelRAF=null;
function stopTravel(){ if(travelRAF){cancelAnimationFrame(travelRAF);travelRAF=null} }
function travelDone(){
  stopTravel(); if(!S||S.phase!=='travel') return;
  if(S.drive.after==='arrive'){ arrive_(); } else S.phase='event';
  go();
}
function startTravel(){
  stopTravel();
  const d=S.drive, N=NODES, A=N[d.from], B=N[d.to]; const g=document.getElementById('vanpos'), tr=document.getElementById('vantrail'); if(!g) return;
  const km=EDGES[d.id].km, ang=vanAngle(A,B);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const dur=reduce?400:Math.min(3400,1400+km*7);
  const t0=performance.now();
  const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
  const step=now=>{ const u=Math.min(1,(now-t0)/dur), t=d.tA+(d.tB-d.tA)*ease(u);
    const x=A.x+(B.x-A.x)*t, y=A.y+(B.y-A.y)*t;
    g.setAttribute('transform',`translate(${x} ${y}) rotate(${ang})`); if(tr){tr.setAttribute('x2',x);tr.setAttribute('y2',y)}
    if(u<1) travelRAF=requestAnimationFrame(step); else { travelRAF=null; setTimeout(travelDone,350); } };
  travelRAF=requestAnimationFrame(step);
}

}

function finishAct(q,extra){
  const a=NODES[S.loc].acts.find(x=>x.id===S.act);
  const e={money:-a.cost+(a.earn||0)+(extra?extra.money:0),fat:a.fat,kh:a.kh+(q?(q.good?2:-1):0)+(extra?extra.kh:0)};
  if(a.day)e.day=a.day;
  let note='';
  if(a.gamble){const win=rnd()<a.gamble.p; if(win){e.money+=a.gamble.prize;e.kh+=1} note=win?` Your boot sails past the locals' marks. You win ${money(a.gamble.prize)}!`:' Your boot flops sideways into the mud. The locals cheer anyway.'}
  if(a.secret&&!S.secrets.includes(a.secret))S.secrets.push(a.secret);
  if(a.gw){ e.money+=a.cost; if(!(S.gwDone||[]).includes(a.id)) (S.gwDone=S.gwDone||[]).push(a.id); note+=' You earn a Great Walks stamp.'; }

    else note+=' The weather held this time, but you skipped part of the Land Safety Code.';

  if(q)(q.good?S.good++:S.bad++);
  apply(e); if(e.kh>0) addTk(q&&q===CCD.opts[0]?'n':actCat(a),e.kh); S.done.push(S.loc+':'+a.id);

/* aurora */
let skyRAF=null;
function startSky(){
  const c=document.getElementById('sky'); if(!c)return;
  const dpr=window.devicePixelRatio||1, W=c.clientWidth, H=c.clientHeight;
  c.width=W*dpr; c.height=H*dpr; const x=c.getContext('2d'); x.scale(dpr,dpr);
  const stars=Array.from({length:90},()=>[rnd()*W,rnd()*H*.7,rnd()*1.3+.3]);
  const still=matchMedia('(prefers-reduced-motion: reduce)').matches;
  cancelAnimationFrame(skyRAF);
  function frame(t){
    t=(t||0)/1000;
    x.fillStyle='#0B1A2A';x.fillRect(0,0,W,H);
    for(const [sx,sy,r] of stars){x.fillStyle='rgba(255,249,236,'+(.5+.4*Math.sin(t*2+sx))+')';x.beginPath();x.arc(sx,sy,r,0,7);x.fill()}
    for(let b=0;b<3;b++){
      const col=b===2?'214,69,61':'90,230,160';
      for(let i=0;i<W;i+=3){
        const y=H*.28+b*18+Math.sin(i/70+t*.6+b)*16+Math.sin(i/23+t*.9)*5;
        const h=60+30*Math.sin(i/50+t+b*2);
        const g=x.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'rgba('+col+',0)');g.addColorStop(.4,'rgba('+col+','+(b===2?.18:.28)+')');g.addColorStop(1,'rgba('+col+',0)');
        x.fillStyle=g;x.fillRect(i,y,3,h);
      }
    }
    x.fillStyle='#16303A';x.beginPath();x.moveTo(0,H*.78);x.quadraticCurveTo(W*.3,H*.62,W*.6,H*.76);x.quadraticCurveTo(W*.8,H*.84,W,H*.72);x.lineTo(W,H);x.lineTo(0,H);x.fill();
    x.fillStyle='#0E1F28';x.fillRect(0,H*.88,W,H*.12);
    const kx=W*.22,ky=H*.86;
    x.fillStyle='#000';x.beginPath();x.ellipse(kx,ky,22,15,0,0,7);x.fill();
    x.beginPath();x.arc(kx+20,ky-8,7,0,7);x.fill();
    x.strokeStyle='#000';x.lineWidth=2.5;x.beginPath();x.moveTo(kx+26,ky-7);x.quadraticCurveTo(kx+40,ky,kx+46,ky+8);x.stroke();
    x.lineWidth=3;x.beginPath();x.moveTo(kx-6,ky+12);x.lineTo(kx-8,ky+22);x.moveTo(kx+6,ky+12);x.lineTo(kx+8,ky+22);x.stroke();
    if(!still)skyRAF=requestAnimationFrame(frame);
  }
  frame(0);
}

if(hot?.ready) hot.ready(boot); else boot(hot?.data??null);
